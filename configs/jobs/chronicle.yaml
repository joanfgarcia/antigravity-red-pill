# Chronicle diario (04:00) como RECETA del dag_job (RFC_JOB_DAG).
#
# Pipeline = SOLO lo referente a Memento (RFC-002). Las fases del sueño viven en
# `sleep.yaml` (prio 8). Retirada 2026-09-11 (operador): la maquinaria legacy de
# la maquinaria legacy (discover/ingest/finalize + chronicle_distill/refine) queda
# FUERA — Qdrant ya no se escribe desde el chronicle; el archivo es Memento en disco.
#
# Etapas atómicas del DAG:
#   - memento          → memento_migrate.py  : render delta de sesiones de los IDEs
#                         (opencode, pi, antigravity, claude) → memento/raw/ + index.md
#   - memento-agentic  → memento_agentic.py  : distill + (annotate|refine) sobre el
#                         árbol (MEM-006: con MEMENTO_ANNOTATE_FROM_RAW=ON anota
#                         desde el raw; OFF = refine legacy) con gate en sombra (§4.6)
#
# job_pause aterriza en la frontera de etapa; job_resume continúa exacto desde la
# etapa interrumpida (checkpoint por ruta). memento-agentic sale 0 si el LLM local
# está caído (retry la próxima noche) — nunca falla el job.
source: dag_job
priority: 7
title: Chronicle diario (ingesta de trayectorias)
mission_id: chronicle-daily
nightly_exempt: true
manifest:
  workdir: .
  stages:
    - id: memento
      type: command
      minion: command_runner
      command: .venv/bin/python scripts/memento_migrate.py
      on_fail: warn
    # Fan-out por sesión (RFC-JOBDAG-002): `discover` lista el DELTA diario y
    # cada sesión es UN step → el progreso del job avanza por sesión (antes era
    # un único comando con el bucle de sesiones DENTRO → `job list` clavado).
    - id: discover
      type: command
      minion: command_runner
      command: .venv/bin/python scripts/list_memento_agentic_pending.py
      on_fail: warn
      depends_on: [memento]
    # ── El pase va POR FASES, no por sesión (2026-10-30) ──────────────────
    # distill y annotate resuelven modelos distintos (`task_profiles.yaml`).
    # Intercalados por sesión —lo que hacía la etapa única memento-agentic—
    # el daemon cambia de modelo DOS VECES por sesión: medido el 2026-10-30,
    # 40 cargas en una noche de 20 sesiones (~1,7 min tirados, y crece con
    # modelos grandes tipo K2-7B Q5 o Spark a 262K). Por fases: 2 por corrida.
    # Ambas etapas comparten la MISMA lista congelada de `discover` (una
    # sesión por step) y se serializan con depends_on.
    - id: memento-distill
      type: command
      minion: command_runner
      fan_out_from: discover
      fanout_stepwise: true          # 1 sesión = UN step → el progreso avanza por sesión
      fanout_label: polaroids         # etiqueta del sub-progreso: "· polaroids k/N"
      progress_file: true            # avance FINO intra-sesión vía RP_PROGRESS_FILE
      command: .venv/bin/python scripts/memento_agentic.py --phase distill --target {{item}}
      # AD-030 (v3): `llm:` POR ETAPA — aquí manda la task distill (bonsai_2_27b).
      llm:
        task: distill
      timeout: 5400
      on_fail: warn
      depends_on: [discover]
    - id: memento-annotate
      type: command
      minion: command_runner
      fan_out_from: discover
      fanout_stepwise: true
      fanout_label: notas
      progress_file: true
      command: .venv/bin/python scripts/memento_agentic.py --phase annotate --target {{item}}
      # El juez es otra decisión, no la del destilador: hoy granite_8b por la
      # task `annotate`. Si algún día K2-7B demuestra ser mejor juez (15/15 en
      # el benchset), se cambia AQUÍ y en task_profiles — sin tocar código.
      llm:
        task: annotate
      timeout: 5400
      on_fail: warn
      depends_on: [memento-distill]
