# Chronicle diario (04:00) como RECETA del dag_job (RFC_JOB_DAG).
#
# Pipeline = SOLO lo referente a Memento (RFC-002). Las fases del sueño viven en
# `sleep.yaml` (prio 8). Retirada 2026-09-11 (operador): la maquinaria legacy de
# `archive_memories` (discover/ingest/finalize + chronicle_distill/refine) queda
# FUERA — Qdrant ya no se escribe desde el chronicle; el archivo es Memento en
# disco y `archive_memories` solo queda como fallback de reconstrucción (§5.1.2).
#
# Etapas atómicas del DAG:
#   - memento          → memento_migrate.py  : render delta de sesiones de los IDEs
#                         (opencode, pi, antigravity, claude) → memento/raw/ + index.md
#   - memento-agentic  → memento_agentic.py  : distill + (annotate|refine) sobre el
#                         árbol (MEM-006: con MEMENTO_ANNOTATE_FROM_RAW=ON anota
#                         desde el raw; OFF = refine legacy) con gate en sombra (§4.6)
#
# job_pause aterriza en la frontera de etapa; job_resume continúa exacto desde la
# etapa interrumpida (checkpoint por ruta). memento-agentic sale 0 si el LLM local
# está caído (retry la próxima noche) — nunca falla el job.
source: dag_job
priority: 7
title: Chronicle diario (ingesta de trayectorias)
mission_id: chronicle-daily
nightly_exempt: true
manifest:
  workdir: .
  stages:
    - id: memento
      type: command
      minion: command_runner
      command: .venv/bin/python scripts/memento_migrate.py
      on_fail: warn
    - id: memento-agentic
      type: command
      minion: command_runner
      command: .venv/bin/python scripts/memento_agentic.py
      # RFC-HARNESS-002 §7 (v3): `llm:` POR ETAPA del dag_job — el pase
      # Memento pide task distill/refine (default granite_8b) + fallup.
      llm:
        task: distill
        fallup: true
      # El default de etapa es 600s y abate las sesiones largas (incidente
      # 2026-09-17, mismo motivo que el fan-out redistill). 5400s como el
      # resto del pase agéntico; el tope real lo pone control.max_step_minutes.
      timeout: 5400
      on_fail: warn
      depends_on: [memento]