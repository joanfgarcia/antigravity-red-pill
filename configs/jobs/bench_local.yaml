# BENCHSET local v1 — MAP por elemento (modelo × variante), fail-soft (RFC-HARNESS-003 corte 6).
#
# UN step = UN elemento (15): reanudable por frontera de elemento (pause/resume),
# watchdog por elemento, y un modelo que falla NO tumba el job: el wrapper
# registra el fallo en failures.jsonl y sale con skip_exit_code (79, sin retry)
# → la cola marca el elemento como saltado y sigue.
# Rutas por env (el runner exporta el .env): $IA_DIR (repo), $LLMTOOLS_VENV, $RP_TMP_DIR.
# Corre desde el repo ($IA_DIR), PYTHONPATH=src.
# SALIDA a temp (desechable): los datos medidos son nuestros; el repo lleva las TOOLS.
source: element_job
priority: 5
title: Benchset local v1 — elenco prioritario (element_job, fail-soft)
mission_id: benchset-v1
elements_command: ["sh", "-c", 'cd "$IA_DIR" && env PYTHONPATH=src "$LLMTOOLS_VENV/bin/python" "$IA_DIR/scripts/bench_local.py" --list-models']
step_command: ["sh", "-c", 'systemctl --user stop redpill-llm.service >/dev/null 2>&1; sleep 2; cd "$IA_DIR" && env PYTHONPATH=src "$LLMTOOLS_VENV/bin/python" -u "$IA_DIR/scripts/bench_local.py" --element --out "$RP_TMP_DIR/red-pill/benchset"; rc=$?; systemctl --user start redpill-llm.service >/dev/null 2>&1; if [ $rc -ne 0 ]; then mkdir -p "$RP_TMP_DIR/red-pill/benchset"; echo "$RP_ELEMENT rc=$rc" >> "$RP_TMP_DIR/red-pill/benchset/failures.jsonl"; exit 79; fi; exit 0']
skip_exit_code: 79
progress:
  mode: single
control:
  max_step_minutes: 45
preflight:
  memory_max: 16G
