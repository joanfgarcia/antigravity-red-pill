# PLANTILLA — Job de un solo paso (script_job) para tareas largas que deben
# correr por el Centralized Job Manager, no a pelo (regla job_dag_execution).
#
# Uso:
#   1. Copia este fichero a configs/jobs/<nombre>.yaml
#   2. Sustituye title / step_command (y opcional priority / control)
#   3. Encola con:  red-pill job submit --recipe <nombre>
#
# El runner (redpill-queue.timer, cada 1 min) lo recoge con OOM shield e
# inhibit del sueño. `max_step_minutes` protege contra un step colgado (cota
# adaptativa: si un step dura más que eso, deja rastro y escala).
#
# ── Modo de progreso (decisión 2026-09-08) ──────────────────────────────────
# progress.mode: single  → SOLO para tareas sencillas/cortas: de UNA llamada
#   al LLM hasta quizá 5-10 (render, un distill puntual). No reporta N/total,
#   no tiene checkpoint granulado, y pause/kill resume re-lanza desde cero
#   (rescatado por el crash-recovery del satélite, no por el job).
# progress.mode: bounded → cuando hay un volumen a priori IMPORTANTE y conocido
#   (p.ej. 597 sesiones de síntesis): exige checkpoint_file + current_key + total.
#   El satélite escribe {current_key: N} tras CADA avance (path en
#   $RP_CHECKPOINT_FILE) → job_status muestra N/total, pause/kill/resume son
#   granulares y el resume continúa donde se quedó. Prioridad BAJA si el
#   trabajo es diferible y reanudable (no pisa a los activos).
#
# Ejemplo de bounded (síntesis masiva):
#   source: script_job
#   priority: 3
#   step_command: uv run python scripts/mi_script.py --limit 597
#   checkpoint_file: state/mi_progreso.json
#   progress:
#     mode: bounded
#     current_key: processed
#     total: 597
#   preflight: {llm_required: true}
#   defer_exit_code: 77
#
# Si la tarea necesita GPU, añade:
#   preflight:
#     vram_unload: true
#     min_free_vram_mb: 3500
#
# Si la tarea usa el LLM local (distill/refine/síntesis/inferencia), añade:
#   preflight:
#     llm_required: true        # LLM caído/GPU ocupada → defer, no fallo
#   defer_exit_code: 77         # el script sale con esto si el LLM se cae a mitad
# (el driver pasa el código como $RP_DEFER_EXIT_CODE al proceso hijo)
#
# NOTA (decisión 2026-09-08): llm_required es un FILTRO INDICATIVO, no una
# garantía de carga. Si el LLM está caído → defer; si responde, se deja pasar
# (el modelo puede estar aún cargando y la primera llamada tardará lo suyo).
# NO se hace polling: el job vuelve a PENDING y el runner lo reintenta hasta
# que el recurso esté libre. Es una limitación real (misma en un datacenter),
# no un defecto.
#
# Para tareas MULTI-etapa o con checkpoint granular, usa un dag_job (skill `dag`)
# en vez de este recipe: árbol de etapas, `job_pause`/`job_resume`/
# `job_transfer`, `requires_gpu` por etapa.
source: script_job
priority: 5                    # entero, mayor = más urgente (default 5)
title: <Descripción del trabajo>
step_command: .venv/bin/python scripts/<tu_script>.py <args>
progress:
  mode: single                 # sin total → muestra solo el contador de steps
control:
  max_step_minutes: 60         # cota por step; ajusta a la duración esperada