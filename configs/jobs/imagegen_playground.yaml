# ImageGen playground — prompt LIBRE (ejemplo: pantalla de carga de un encargo).
#
# UN step = UN modelo (element_job, fail-soft): si un modelo OOMea o falla,
# se REGISTRA en failures.jsonl y sale con skip_exit_code (79) → la cola lo
# marca saltado y SIGUE con el resto. Reanudable por frontera de elemento.
#
# Salida → STAGING (docs/CORE/MEDIA_MODELS.md): "$RP_MEDIA_STAGING/imagegen-playground" (env; sin default).
# Al aprobar: `red-pill media promote imagegen-playground --to <destino>`.
# Prompt: --prompt-file "$RP_MEDIA_PROMPT" (env). El bloque `media:`
# adapta el tamaño POR MODELO (zimage ÷16 → 1088; bonsai OOMea → salta).
# Reutiliza la venv de configs/jobs/imagegen_setup.yaml (misma máquina).
# Rutas por env (el runner exporta el .env): $IA_DIR (repo), $IMAGE_FORGE_HOME (forge).
source: element_job
media:
  task: concept          # baseline; la adaptación real se hace POR ELEMENTO (modelo)
  width: 1920
  height: 1080
priority: 3
title: ImageGen playground — pantalla de carga (prompt libre)
mission_id: imagegen-playground
elements_command: ["sh", "-c", 'OUT="$RP_MEDIA_STAGING/imagegen-playground"; mkdir -p "$OUT"; "$IMAGE_FORGE_HOME/venv/bin/python" "$IA_DIR/scripts/imagegen/gen_image.py" --list-elements --prompt-file "$RP_MEDIA_PROMPT" --out "$OUT" --width 1920 --height 1080']
step_command: ["sh", "-c", 'OUT="$RP_MEDIA_STAGING/imagegen-playground"; mkdir -p "$OUT"; "$IMAGE_FORGE_HOME/venv/bin/python" -u "$IA_DIR/scripts/imagegen/gen_image.py" --element --out "$OUT"; rc=$?; if [ $rc -ne 0 ]; then echo "$RP_ELEMENT rc=$rc" >> "$OUT/failures.jsonl"; exit 79; fi; exit 0']
skip_exit_code: 79
progress:
  mode: single
control:
  max_step_minutes: 90
preflight:
  vram_unload: true
  min_free_vram_mb: 7000
  memory_max: 16G
