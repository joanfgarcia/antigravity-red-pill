# Music demo — renderiza una pieza de prueba: MIDI (mido) → WAV (FluidSynth).
# Requiere `fluidsynth` instalado (sudo apt install fluidsynth). Salida a staging.
source: script_job
priority: 4
title: Music demo — LLM/MIDI → FluidSynth → WAV
mission_id: musicgen
step_command: ["sh", "-c", 'OUT="$RP_MEDIA_STAGING/musicgen"; mkdir -p "$OUT"; "$MUSIC_FORGE_HOME/venv/bin/python" "$IA_DIR/scripts/music/compose.py" --demo --out "$OUT/demo"']
progress:
  mode: single
control:
  max_step_minutes: 15
preflight:
  memory_max: 8G
