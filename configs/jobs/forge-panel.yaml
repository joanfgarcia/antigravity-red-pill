# Forge — Panel Adversarial (feature O2) como receta del dag_job.
#
# RECETA DEL PANEL PURO: contiene SOLO la etapa compound `panel` (5 lentes +
# judge). Se referencia desde una misión con `{type: dag, recipe: forge-panel}`
# (RFC_JOB_DAG §4.5) — el compilador del skill la emite cuando un paso del burst
# manifest declara `panel: true`. La etapa de implementación NO vive aquí: es de
# la misión que referencia el panel.
#
# seed: true — plantilla por-instalación. Cada instalación fija sus modelos
# reales en .red-pill/jobs/ (ver NOTE_MODEL_POLICY_ROLES.md).
#
# El adversarial se pide EXPLÍCITAMENTE: si un paso no declara `panel: true`, el
# panel no corre (decisión del que monta el plan, 2026-08-14).
#
# El judge NO recibe los reportes en el prompt: lee del disco los reportes de
# sus lentes (`.cell/reports/<ruta-panel>/<lens>.json`, escritos por cada
# sub-etapa) y adjudica los conflictos (panel-policy.md §Aggregation).
source: dag_job
priority: 5
mission_id: forge-panel
seed: true
backend: opencode
max_parallel_level: 2
max_concurrency: 4
manifest:
  workdir: .
  stages:
    - id: panel
      type: compound
      parallel: true
      on_fail: warn
      sub_etapas:
        - id: lens-correctness
          type: agent
          minion: agent
          model: flash  # SEED: diversidad — 2+ modelos distintos en el panel
          prompt: <refuta correctness con evidencia ejecutada>
        - id: lens-env-segregation
          type: agent
          minion: agent
          model: flash  # SEED
          prompt: <refuta segregación de entorno>
        - id: lens-plan-completeness
          type: agent
          minion: agent
          model: flash  # SEED
          prompt: <refuta cobertura del plan>
        - id: lens-security
          type: agent
          minion: agent
          model: flash  # SEED — lente que ataca superficie distinta
          prompt: <refuta seguridad con evidencia ejecutada>
        - id: lens-perf-repro
          type: agent
          minion: agent
          model: flash  # SEED
          prompt: <reproduce rendimiento y refuta>
        - id: judge
          type: agent
          minion: agent
          model: flash  # SEED — model distinto a la mayoría de refuters, max effort
          depends_on: [lens-correctness, lens-env-segregation, lens-plan-completeness, lens-security, lens-perf-repro]
          prompt: <lee .cell/reports/<ruta>/lens-*.json y adjudica los conflictos>
