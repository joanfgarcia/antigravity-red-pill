# Taxonomía del dolor (AD-108).

# No todas las señales son el mismo dolor ni deben escalar igual: una picadura
# de mosquito no se comporta como una hemorragia, y las ganas de orinar (que se
# limpian) no se comportan como el hambre (que si no se atiende termina en
# SYSTEM-FAILURE). Dos ejes separan las clases: velocidad de aparición y
# reversibilidad de la consecuencia.
#
# Los números son una PRIMERA parametrización, no una medición: se ajustan aquí
# sobre la marcha, sin tocar código.

default_class: necesidad

# Reconciliación del dolor (RFC-OBS-005). Todo lo ajustable vive aquí: cambiar
# cualquiera de estos valores no requiere tocar código.
reconcile:
  enabled: true
  report_only: true   # P0: calcula y registra, no borra (P1 lo apaga)
  absences: 2         # rondas consecutivas sin emisión antes de evaporar
  grace_hours: 24     # ventana que conserva edad y acuse tras evaporar

classes:
  irritacion:
    # Picadura: molesta, no tiene consecuencia. Nunca pasa de `info`.
    base: 1.5
    slope_per_hour: 0.0
    ceiling: 3.0
    cliff_hours: null
    ack_mode: freeze
  necesidad:
    # Vejiga, intestino: escala, y si se ignora estás hecho una porquería...
    # pero se limpia. Sin acantilado: no hay pérdida irreversible.
    base: 2.5
    slope_per_hour: 0.6
    ceiling: 7.0
    cliff_hours: null
    ack_mode: freeze
  sed:
    # Hambre, sed: escala despacio y tiene un punto de no retorno. Cruzarlo es
    # SYSTEM-FAILURE (p. ej. el buffer de interacción purga a los 30 días).
    base: 2.5
    slope_per_hour: 0.25
    ceiling: 8.9
    cliff_hours: 720
    ack_mode: silence
  herida:
    # Sangrando: ya duele (no empieza en info) y el reloj corre en minutos.
    base: 7.5
    slope_per_hour: 0.0
    ceiling: 8.5
    cliff_hours: 0.5
    ack_mode: silence
  fallo:
    # Desangrándose ahora: no escala, ya está en el máximo. Un evento, no un estado.
    base: 10.0
    slope_per_hour: 0.0
    ceiling: 10.0
    cliff_hours: null
    ack_mode: none

# Etiquetas legibles del 0–10 (conviven con la barra de intensidad).
stages:
  info: 0.0
  warning: 4.0
  error: 7.0
  system_failure: 9.95

# Mapa de las señales reales del kernel a su clase. `cliff_hours` permite el
# override por señal cuando el daño medible tiene otra fecha.
# BEGIN GENERATED: signal_inventory (scripts/signal_inventory.py --write)
inventory:
  # Generado desde los emisores; no editar a mano.
  segments:
    repo: [signal_formatting_failure, signal_infra_failure, signal_test_failure, signal_typing_failure]
    runtime: [signal_daemon_failure, signal_journal_failure]
    vitals: [signal_blindness_failure, signal_exhaustion_failure, signal_pain_failure]
  repo_steps: {mypy: signal_typing_failure, ruff: signal_formatting_failure, tests: signal_test_failure}
  plugins:
    check_duplicate_services: [signal_config_missing_failure, signal_duplicate_service_failure, signal_hung_service_failure, signal_memory_bloat_failure, signal_runaway_cpu_failure, signal_service_down_failure, signal_service_unwanted_failure]
    check_neon_link: [signal_neon_hung_failure]
    check_qdrant: [signal_amnesia_failure]
    check_sip: [signal_sip_loading_failure, signal_sip_stuck_failure, signal_sip_unhealthy_failure]
    check_sip_provisioning: [signal_sip_corrupt_dual_bind_failure, signal_sip_missing_dual_bind_failure, signal_sip_missing_llama_cpp_failure, signal_sip_missing_model_file_failure, signal_sip_missing_model_profile_failure, signal_sip_missing_model_profiles_failure, signal_sip_missing_service_file_failure, signal_sip_missing_setup_script_failure, signal_sip_missing_start_sh_failure, signal_sip_missing_venv_failure, signal_sip_uds_mismatch_failure]
    check_sqlite: [signal_amnesia_failure]
    check_syntax: [signal_syntax_failure]
    service_base: [signal_service_down_failure, signal_service_unwanted_failure]
# END GENERATED: signal_inventory

signals:
  jobs_frustrated:
    class: necesidad
  korsakoff_amnesia:
    class: necesidad
  memory_bloat:
    class: necesidad
  runaway_cpu:
    class: necesidad
  session_mirror_stats:
    class: irritacion
  hung_service:
    class: herida
  cuda_cortex_failure:
    class: herida
  service_down:
    class: fallo
  chronicle_blocked_by_ide:
    class: sed
  interaction_unrendered_purged:
    class: fallo
  dead_letters_soul:
    class: herida
  sw_hub_coverage:
    class: irritacion
  # Nombres reales que emite el SentinelAuditor (`signal_<tipo>_failure`).
  signal_service_down_failure:
    class: herida        # D-08: es un ESTADO medido con is-active, no un evento
    reconcilable: true
  signal_hung_service_failure:
    class: herida
    reconcilable: true
  signal_sip_stuck_failure:
    class: herida
    reconcilable: true
  signal_memory_bloat_failure:
    class: necesidad
    reconcilable: true
  signal_runaway_cpu_failure:
    class: necesidad
    reconcilable: true
  signal_interaction_unrendered_purged_failure:
    class: fallo
    reconcilable: false   # evento consumado: se atiende o se evapora a mano
  interaction_expiring_soon:
    class: sed             # caduca y se pierde: hay acantilado, no vuelve
