# Rol `worker`: ejecuta encargos acotados con resultado verificable.
# El ORDEN de `skills_install` es la prioridad: si la capacidad no da presupuesto
# para todas, las que sobran van a la biblioteca (consultables, no anunciadas).
id: worker
purpose: "Ejecuta encargos acotados y reporta evidencia."
skills_install:
  - workspace-memory
  - job-manager
  - python-venv-runner
  - git-pushing
  - commit
  - context-distiller
  - frontmatter
  - knowledge-access
# `git_workflow` está retirada (RETIRED_ANCHORS): su texto salió del roster y un
# `rules_blocks` que la pida aborta la siembra al no encontrar su seed.
rules_blocks: [sovereign_handshake, agent_core, knowledge_access]
boot_card: worker
limits:
  max_steps: 40
gates: [bench_task_success]
