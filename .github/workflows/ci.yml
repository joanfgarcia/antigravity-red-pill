name: Red Pill CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    # DEP-001 / SEC-F01: Dependency vulnerability scan — BLOCKING for direct deps.
    # Strategy: run pip-audit in two passes.
    # Pass 1 (non-blocking): full scan saved as JSON artifact for traceability.
    # Pass 2 (blocking): scan scoped to direct dependencies only (from uv export).
    # Transitive CVEs we cannot fix will NOT block the build; direct dep CVEs will.
    - name: Security Audit — pip-audit full scan (non-blocking, for report)
      continue-on-error: true
      shell: bash
      run: |
        uv run pip-audit \
          --progress-spinner=off \
          --output=json \
          --format=json \
          > pip-audit-report.json || true
        uv run pip-audit --progress-spinner=off || true

    - name: Security Audit — pip-audit direct deps (BLOCKING, SEC-F01)
      shell: bash
      run: |
        # Export only direct (non-dev) deps to a temp requirements file
        # Added --no-emit-project to avoid failure on private project package
        uv export --no-dev --no-hashes --no-emit-project -o direct_deps_raw.txt
        # Filter out private/unpublished packages that pip-audit cannot resolve
        # pure-mls: local MLS library not yet published on PyPI (git dep)
        grep -v 'pure-mls' direct_deps_raw.txt > direct_deps.txt || true
        if grep -q 'pure-mls' direct_deps_raw.txt; then
          echo "::warning::pure-mls is a private git dependency and was excluded from pip-audit. It will be included once published on PyPI."
        fi
        # Fail the build if any CVE hits a direct dependency
        uv run pip-audit \
          --progress-spinner=off \
          --skip-editable \
          --ignore-vuln CVE-2025-69872 \
          --ignore-vuln CVE-2026-25990 \
          --ignore-vuln CVE-2026-40192 \
          --ignore-vuln CVE-2026-28684 \
          --ignore-vuln CVE-2026-40347 \
          -r direct_deps.txt



    - name: Upload pip-audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pip-audit-report-${{ matrix.os }}-py${{ matrix.python-version }}
        path: pip-audit-report.json
        retention-days: 30

    - name: Ensure Sound of Silence (Ruff Linting)
      run: uv run ruff check src/ scripts/ tests/

    - name: Static Type Audit (Mypy)
      if: matrix.os == 'ubuntu-latest'
      run: uv run mypy src/red_pill/

    - name: Run All Validation & Logic Tests with Coverage
      env:
        QDRANT_API_KEY: "ci-test-key-770"
        SIDECAR_AUTH_KEY: "ci-test-sidecar-key-770"
      # TST-002: Exclude integration/ — those require Docker and run in integration.yml
      # Coverage threshold (80%) and omit list are defined in pyproject.toml [tool.coverage.*]
      run: uv run pytest --cov=src/red_pill --cov-report=xml --cov-report=term --ignore=tests/integration tests/
