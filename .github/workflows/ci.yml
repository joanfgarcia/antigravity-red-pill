name: Red Pill CI

on:
  push:
    branches: [ "main", "feat/*", "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    # DEP-001: Dependency vulnerability scan (audit finding P1)
    # Runs on every push/PR. Failures are reported but non-blocking for
    # unfixable transitive dependencies (continue-on-error: true).
    # To enforce strict blocking: set continue-on-error: false.
    - name: Security Audit — pip-audit (DEP-001)
      continue-on-error: true
      run: |
        uv run pip-audit \
          --progress-spinner=off \
          --output=json \
          --format=json \
          > pip-audit-report.json || true
        # Always print a human-readable summary to the log
        uv run pip-audit --progress-spinner=off || true

    - name: Upload pip-audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pip-audit-report-py${{ matrix.python-version }}
        path: pip-audit-report.json
        retention-days: 30

    - name: Ensure Sound of Silence (Ruff Linting)
      run: uv run ruff check src/ scripts/ tests/

    - name: Static Type Audit (Mypy)
      run: uv run mypy src/red_pill/

    - name: Run All Validation & Logic Tests with Coverage
      env:
        QDRANT_API_KEY: "ci-test-key-770"
        SIDECAR_AUTH_KEY: "ci-test-sidecar-key-770"
      # TST-002: Exclude integration/ — those require Docker and run in integration.yml
      run: uv run pytest --cov=src/red_pill --cov-report=xml --cov-report=term --cov-fail-under=80 --ignore=tests/integration tests/
