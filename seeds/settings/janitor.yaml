# Configuración global de tareas del Janitor Minion
plugins:
  events_db_purge:
    enabled: true
    days_to_keep: 7
    dead_letters_days_to_keep: 30  # FAILED del outbox + dead_letters (margen para `neon-link redrive`)
  scratch_purge:
    enabled: true
    days_to_keep: 7
  log_rotation:
    enabled: true
    max_size_bytes: 10485760  # 10MB
    days_to_keep: 7           # Retención de logs rotados
  awakening_logs:
    enabled: true
    days_to_keep: 30          # TTL de los logs por despertar (${AGENT_CORE_DIR}/awakening/)
  session_liveness:
    enabled: true
    ttl_h: 48                 # TTL de los latidos de sesión (${STATE_DIR}/sessions/live/)
  orphaned_parents_sweep:
    enabled: true
