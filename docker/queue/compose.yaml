services:
  redis:
    image: docker.io/library/redis:alpine
    ports:
      - "127.0.0.1:8770:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: ../../
      dockerfile: docker/queue/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ../../
      dockerfile: docker/queue/Dockerfile.worker
    command: ["uvicorn", "red_pill.tasks.api_gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8771:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
