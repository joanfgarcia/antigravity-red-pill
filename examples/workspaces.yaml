# Workspace registry for red-pill — PROJECT workspaces (peers).
# Copy to ~/.config/red-pill/workspaces.yaml and edit for your machine.
#
# red-pill is the AGENT (identity + Bünker + a GLOBAL Agent_Core desk). On top of it you work
# in N independent PROJECT workspaces (peers) — they have no parent/child relationship.
#
# - agent_core : the agent's GLOBAL personal desk (transversal, shared across ALL workspaces).
#                YOU choose where to mount it (typically under your red-pill ecosystem root).
# - workspaces : your project repos. Each one's rules/standards are DISCOVERED at runtime via the
#                `.agent` convention (a dir or symlink at/above the workspace root) — never hardcoded.
#                `atlas`    : optional explicit standards path (hook; used by the permissions step).
#                `graphify` : whether the AST-refresh timer indexes this workspace (hook).
version: 1
agent_core: ~/Agent_Core
workspaces:
  - { name: example, root: ~/projects/example, atlas: null, graphify: false }
