services:
  redpill:
    unit: redpill.service
    type: daemon-loop
    loop_interval_s: 3600
    category: core
    required: true
    enabled_config_key: PULSE_ENABLED

  neon-link:
    unit: neon-link.service
    type: daemon-loop
    loop_interval_s: 1
    watchdog_multiplier: 3       # WatchdogSec=3 — requires neon-link>=0.4.0
    health_url: "http://127.0.0.1:8770/health"
    legacy_aliases:
      - redpill-neonlink.service
    category: plugin
    required: false
    enabled_config_key: NEON_LINK_ENABLED

  redpill-llm:
    unit: redpill-llm.service
    type: daemon-listener
    health_url: "http://127.0.0.1:8776/health"
    legacy_aliases:
      - red-pill-minion.service
    category: core
    required: true

  redpill-bunker:
    unit: redpill-bunker.service
    type: daemon-loop
    loop_interval_s: 10
    category: core
    required: true

  redpill-echo:
    unit: redpill-echo.service
    type: daemon-loop
    loop_interval_s: 60
    watchdog_multiplier: 3
    category: core
    required: false

  redpill-auditor:
    unit: redpill-auditor.service
    type: oneshot
    max_runtime_s: 120
    category: core
    required: true

  redpill-extractor:
    unit: redpill-extractor.service
    type: oneshot
    max_runtime_s: 120
    category: core
    required: false

  redpill-janitor:
    unit: redpill-janitor.service
    type: oneshot
    max_runtime_s: 60
    category: core
    required: true

  redpill-pulse:
    unit: redpill-pulse.service
    type: oneshot
    max_runtime_s: 600
    category: core
    required: false

  redpill-sleep:
    unit: redpill-sleep.service
    type: oneshot
    max_runtime_s: 600
    category: core
    required: false

  redpill-queue:
    unit: redpill-queue.service
    type: oneshot
    max_runtime_s: 120
    category: core
    required: false

  redpill-telemetry:
    unit: redpill-telemetry.service
    type: oneshot
    max_runtime_s: 60
    category: core
    required: false

  redpill-wake:
    unit: redpill-wake.service
    type: oneshot
    max_runtime_s: 180
    category: core
    required: false
