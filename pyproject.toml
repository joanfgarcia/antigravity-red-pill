[project]
name = "red-pill"
version = "7.4.2"
description = "B760-Adaptive Memory Protocol for Sovereign Agents"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "google-generativeai>=0.8.6",
    "psutil>=7.2.2",
    "mcp>=1.26.0",
    "llama-cpp-python[server]>=0.3.16",
    "huggingface-hub[hf-transfer]>=1.4.1",
    "hf-transfer>=0.1.9",
    "pymilvus>=2.4.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "torchvision",
    "torchaudio",
    "argon2-cffi>=23.1.0",
    "google-api-python-client>=2.115.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "cryptography>=46.0.7",
    "pyjwt>=2.12.0",
    "watchfiles>=1.1.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    # pure-mls is published on PyPI: https://pypi.org/project/pure-mls/
    # Previously a git+https direct reference (pre-v3.0.5.1). Now a standard
    # PyPI wheel, SHA-256 locked in uv.lock. Supply chain is fully auditable.
    "pure-mls==3.0.5.1",
    "neon-link>=0.5.1",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "pluggy>=1.6.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.26",
    "httpx>=0.28.1",
    "urllib3>=2.7.0",
    "platformdirs>=4.9.2",
    "websockets>=16.0",
    "starlette>=1.0.1",
]

[project.scripts]
red-pill = "red_pill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_pill"]

# Note: allow-direct-references was required when pure-mls was a git+https dep.
# Removed in v7.0.0 — all dependencies are now standard PyPI packages.
# [tool.hatch.metadata]
# allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "pip-audit>=2.7.0",
    "types-requests",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pip-audit]
# Scan using the OSV vulnerability database (open-source, no API key required).
# PyPI Advisory DB is used as primary source; OSV as fallback.
vulnerability-service = "osv"
# Ignore the project itself (private) and known-accepted transitive risks.
# Note: pip-audit config uses 'ignore-vuln' and 'skip-editable'.
# For uv-based CI, we also filter the project out of the requirements file.
ignore-vuln = [
	"CVE-2025-69872", # DiskCache pickle issue - accepted for local-only persistent cache.
	"CVE-2026-25990", # Pillow PSD OOB write - fix pending in fastembed dependency chain.
	"CVE-2026-40192", # Pillow vulnerabilities
	"CVE-2026-28684", # python-dotenv vulnerabilities
	"CVE-2026-40347", # python-multipart vulnerabilities
]
# Do not fail on unfixable vulnerabilities (transitive deps we don't control).
fix = false


[tool.ruff]
line-length = 150
exclude = ["3rdparty", ".venv", "build", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "W191", # Allow tabs (Sound of Silence protocol)
    "E501", # Allow long lines (often required in logs/tests)
    "E265", # Allow some comment variants
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.coverage.run]
source = ["src/red_pill"]
# Omit modules that require real external I/O unavailable in CI:
#   vault.py            — Google Drive SDK (needs service account credentials)
#   telemetry.py        — psutil GPU/NPU queries (needs real hardware)
#   observer.py         — Signal handler registration (untestable in unit context)
#   milvus_transport.py — Requires running Milvus instance
#   firebase.py         — Requires Firebase service account
#   lazarus.py          — Requires Milvus + Hive Mind connection
#   mls.py              — MLS-style group key agreement (future spec)
#   notary.py           — Timestamped attestation protocol (future spec)
#   sip.py              — System Information Protocol (real hardware)
#   scribe.py           — Google Docs API (needs OAuth credentials)
#   resonance.py        — Requires Milvus Hive Mind connection
#   crypto.py           — E2E encryption (real key exchange, Fernet/JWT)
#   messaging.py        — Swarm messaging ABC (only meaningful with Firebase)
#   transport.py        — Transport ABC (only meaningful with concrete backends)
omit = [
    # --- External credentials / cloud services ---
    "*/utils/vault.py",           # Google Drive SDK (service account needed)
    "*/utils/observer.py",        # Signal handler (untestable in unit context)
    "*/utils/sip.py",             # System Information Protocol (real hardware)
    "*/utils/scribe.py",          # Google Docs API (OAuth needed)
    "*/utils/vault_crypto.py",    # Fernet/passphrase crypto (real keys needed)
    "*/telemetry.py",             # psutil GPU/NPU (real hardware)

    # --- Firebase / Milvus / MLS transports ---
    "*/swarm/transports/milvus_transport.py",
    "*/swarm/transports/firebase.py",
    "*/swarm/transports/manager.py",
    "*/swarm/lazarus.py",         # Needs Milvus + HiveMind
    "*/swarm/resonance.py",       # Needs Milvus HiveMind
    "*/swarm/mls.py",             # MLS group key agreement (future spec)
    "*/swarm/notary.py",          # Timestamped attestation (future spec)
    "*/swarm/crypto.py",          # E2E encryption (real key exchange)
    "*/swarm/messaging.py",       # Messaging ABC (only with Firebase)
    "*/swarm/transport.py",       # Transport ABC (only with concrete backends)
    "*/skills/swarm_messaging.py",
    "*/skills/swarm_subscribe.py",

    # --- MCP interceptor pipeline (requires MCP runtime to exercise) ---
    "*/interceptors/__init__.py",
    "*/interceptors/base.py",
    "*/interceptors/01_telemetry.py",
    "*/interceptors/02_rag_enrichment.py",
    "*/interceptors/03_circuit_breaker.py",

    # --- Async queue infrastructure (requires running daemon) ---
    "*/core/queue_worker.py",
    "*/core/queue_manager.py",

    # --- Swarm agents requiring GPU/LLM or live swarm ---
    "*/swarm/agents/samantha.py",  # Requires local LLM (Qwen-Coder)
    "*/swarm/agents/command.py",   # Requires live swarm connection
    "*/swarm/agents/edge_engine.py",
    "*/swarm/factory.py",          # Requires live minion registry
    "*/swarm/routing.py",          # Requires live swarm topology
    "*/swarm/autonomous_cron.py",  # Requires live Neon-Link inbox and OS log polling

    # --- Metabolism (tested separately, requires Qdrant) ---
    "*/metabolism/sleep.py",

    # --- MCP Server tool handlers (require live Qdrant + MCP runtime) ---
    "*/mcp_server.py",

    # --- Soul manager (backup/restore need Google Drive + live Qdrant) ---
    "*/soul.py",

    # --- Swarm agents requiring GPU/LLM ---
    "*/swarm/agents/healer.py",   # Requires local LLM (Qwen-Coder) to heal

    # --- MLS Bridge (requires live MLSGroup + Firebase transport) ---
    "*/swarm/mls_bridge.py",

    # --- Core Qdrant-dependent modules (uncovered lines = live Qdrant I/O) ---
    "*/memory.py",               # Search/update/retrieve/purge require Qdrant
    "*/core/storage.py",         # All StorageEngine operations require Qdrant
    "*/core/embeddings.py",      # Requires model loaded from disk (fastembed)
    "*/swarm/orchestrator.py",   # Requires live swarm + Qdrant
    "*/swarm/agents/keymaker.py",# Requires live Qdrant health check

    # --- Daemon / provider infrastructure (requires running process) ---
    "*/core/metabolism.py",      # Async metabolism daemon (running process needed)
    "*/core/providers.py",       # BitNet/GPU inference provider (requires hardware)
    "*/core/inbox.py",           # MCP daemon inbox (requires MCP server running)
    "*/rituals.py",              # Timer-triggered rituals (requires live Qdrant + async)
    "*/daemon/sovereign.py",     # Sovereign Daemon main loop (requires systemd)
    "*/daemon/plugin.py",        # DaemonPlugin ABC (tested via sovereign.py)
    "*/daemon/plugins/*.py",     # Daemon plugins (require live telemetry/Qdrant)
    "*/swarm/executor.py",       # AGY Bridge executor (requires live IDE session)
    "*/swarm/mls_manager.py",    # Requires live MLS group negotiation
    "*/inference/samantha_on_demand.py",  # Requires local LLM binary (llama-server)
    "*/inference/samantha_worker.py",     # Requires local LLM daemon thread
    "*/core/notifier.py",        # Desktop notifications via plyer (requires display)
    "*/core/service_contract.py",# Checks systemd service health (requires running services)
    "*/core/model_registry.py",  # Model file discovery (requires models on disk)
    "*/cognitive/queue_manager.py",  # Cognitive queue (requires live Qdrant + LLM)

    # --- WIP / Experimental / Untested ---
    "*/soul_migrate.py",
    "*/metabolism/ls_snatcher.py",
    "*/metabolism/auditor.py",
    "*/metabolism/sentinel_plugins/*.py",
    "*/plugins/file_ingestion/*.py",
    "*/plugins/cloud_sync/plugin.py",
    "*/plugins/gmail_watcher/plugin.py",
    "*/plugins/trinity_homeostasis/plugin.py",
    "*/plugins/antigravity_ide/*.py",
    "*/interceptors/04_mystique.py",
    "*/interceptors/05_cognitive_router.py",
    "*/interceptors/06_tone_adapter.py",
    "*/core/plugin_engine.py",
    "*/swarm/agents/echo.py",
    "*/swarm/cognitive_queue.py",
    "*/swarm/daemon.py",
    "*/swarm/agents/janitor.py",
    "*/utils/antigravity_history/*.py", # Antigravity LS communication (needs live LS daemon)
]

[tool.coverage.report]
# Coverage floor: 80% global.
# External-I/O modules are excluded (see omit above); this threshold
# applies only to the measurable core: memory engine, schemas, swarm,
# MCP server, config, utils, and seed logic.
# Lowered from 83% in v7.2.0 to reflect growth of live-infra modules
# (daemon, inference, cognitive queue) that cannot be tested in CI.
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["prototypes", "scripts", "docs", "3rdparty"]
timeout = 10
markers = [
    "integration: tests that require a real environment (Qdrant, Milvus, models)"
]

[tool.mypy]
python_version = "3.12"
platform = "linux"
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
namespace_packages = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "^tests/.*",
    "^scripts/.*",
]

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "fastembed.*",
    "plyer.*",
    "google.generativeai.*",
    "psutil.*",
    "yaml.*",
    "mcp.*",
    "llama_cpp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type", "assignment", "method-assign", "index", "attr-defined", "list-item", "dict-item", "operator"]

