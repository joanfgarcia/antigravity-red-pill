[project]
name = "antigravity-red-pill"
version = "5.6.1"
description = "A neuro-inspired local RAG persistence layer for AI assistants."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.0.0",
    "google-generativeai>=0.8.6",
    "psutil>=7.2.2",
    "mcp>=1.26.0",
    "llama-cpp-python>=0.3.16",
    "huggingface-hub[hf-transfer]>=1.4.1",
    "hf-transfer>=0.1.9",
    "pymilvus>=2.4.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "argon2-cffi>=23.1.0",
    "google-api-python-client>=2.115.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
red-pill = "red_pill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_pill"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pip-audit>=2.7.0",
    "types-requests",
]

[tool.pip-audit]
# Scan using the OSV vulnerability database (open-source, no API key required).
# PyPI Advisory DB is used as primary source; OSV as fallback.
vulnerability-service = "osv"
# Ignore the project itself (private) and known-accepted transitive risks.
# Note: pip-audit config uses 'ignore-vuln' and 'skip-editable'.
# For uv-based CI, we also filter the project out of the requirements file.
ignore-vuln = [
	"CVE-2025-69872", # DiskCache pickle issue - accepted for local-only persistent cache.
	"CVE-2026-25990", # Pillow PSD OOB write - fix pending in fastembed dependency chain.
]
# Do not fail on unfixable vulnerabilities (transitive deps we don't control).
fix = false


[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "W191", # Allow tabs (Sound of Silence protocol)
    "E501", # Allow long lines (often required in logs/tests)
    "E265", # Allow some comment variants
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.coverage.run]
source = ["src/red_pill"]
# Omit modules that require real external I/O that is unavailable in CI:
#   vault.py     — Google Drive SDK (needs service account credentials)
#   telemetry.py — psutil GPU/NPU queries (needs real hardware)
#   hive.py      — Milvus connection (needs running Milvus instance)
#   cli.py       — Click entrypoint (tested via integration tests)
#   observer.py  — Signal handler registration (untestable in unit context)
#   memory_daemon.py — Unix socket server (tested via integration tests)
omit = [
    "*/utils/vault.py",
    "*/telemetry.py",
    "*/utils/observer.py",
]

[tool.coverage.report]
# Coverage floor: 93% global, 98% on memory.py (core engine).
# External-I/O modules are excluded (see omit above); this threshold
# applies only to the measurable core: memory engine, schemas, swarm,
# MCP server, config, utils, and seed logic.
fail_under = 93
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
